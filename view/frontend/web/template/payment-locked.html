<div class="iwd-osc-payment-locked" data-bind="visible: isLocked">
    <span class="iwd-osc-payment-locked__icon">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 12 6h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/>
        </svg>
    </span>
    <div class="iwd-osc-payment-locked__body">
        <p class="iwd-osc-payment-locked__title" data-bind="text: lockedTitle"></p>
        <p class="iwd-osc-payment-locked__text" data-bind="foreach: bodyParts">
            <!-- ko if: bold --><strong data-bind="text: text"></strong><!-- /ko -->
            <!-- ko ifnot: bold --><span data-bind="text: text"></span><!-- /ko -->
        </p>
        <ul class="iwd-osc-payment-locked__steps">
            <li class="iwd-osc-payment-locked__step"
                data-bind="css: {'iwd-osc-payment-locked__step--done': contactDone, 'iwd-osc-payment-locked__step--current': !contactDone()}">
                <span class="iwd-osc-payment-locked__step-num">
                    <!-- ko if: contactDone -->&#10003;<!-- /ko -->
                    <!-- ko ifnot: contactDone -->1<!-- /ko -->
                </span>
                <span data-bind="text: stepContact"></span>
                <!-- ko ifnot: contactDone -->
                <span class="iwd-osc-payment-locked__status" data-bind="text: stepStatus"></span>
                <!-- /ko -->
            </li>
            <li class="iwd-osc-payment-locked__step"
                data-bind="css: {'iwd-osc-payment-locked__step--current': contactDone() && !deliveryDone()}">
                <span class="iwd-osc-payment-locked__step-num">2</span>
                <span data-bind="text: stepShipping"></span>
                <!-- ko if: contactDone() && !deliveryDone() -->
                <span class="iwd-osc-payment-locked__status" data-bind="text: stepStatus"></span>
                <!-- /ko -->
            </li>
            <li class="iwd-osc-payment-locked__step"
                data-bind="css: {'iwd-osc-payment-locked__step--done': deliveryDone}">
                <span class="iwd-osc-payment-locked__step-num">
                    <!-- ko if: deliveryDone -->&#10003;<!-- /ko -->
                    <!-- ko ifnot: deliveryDone -->3<!-- /ko -->
                </span>
                <span data-bind="text: stepDelivery"></span>
            </li>
        </ul>
    </div>
</div>
